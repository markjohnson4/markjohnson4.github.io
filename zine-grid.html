<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
        }
        @media print {
            .noPrint {
                display: none;
            }
        }
        /* form */
        .textInput,
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }

        button {
            border: 1px solid black;
            padding: 1rem;
            text-align: center;
            width: 100%;

        }
        .textWrap {
            margin: 1rem auto;
            max-width: 40ch;
            padding: 1rem;
            border: 2px solid rgb(45, 152, 246);
            background-color: azure;
        }
        p,
        label {
            display: block;
            margin: 1rem 0;
        }
        label>span {
            display: block;
            padding-bottom: 0.2rem;
        }

        /* app */
        :root {
            
            
        }
        :root {
            --cmPerInch: 2.54;
            --pointsPerInch: 72pt;
            --pointsPerCm: calc(var(--pointsPerInch)/var(--cmPerInch));
            --pageWidth: calc(var(--pointsPerInch)*8.5);
            --pageHeight: calc(var(--pointsPerInch)*11);
            --boxWidth: calc(var(--pageWidth)/2);
            --boxHeight: calc(var(--pageHeight)/4);

            --pageMarginTop: 9pt;
            --pageMarginRight: 9pt;
            --pageMarginBottom: 9pt;
            --pageMarginLeft: 9pt;  
        }
        .page {
            width: var(--pageWidth);
            height: var(--pageHeight);
            /* background-color: red; */
            display: flex;
            flex-wrap: wrap;

            /* test only  */
            padding: var(--pageMarginTop) var(--pageMarginRight) var(--pageMarginBottom) var(--pageMarginLeft);
        }
        .page > div {
            width: var(--boxWidth);
            height: var(--boxHeight);
            /* background-color: rgba(0, 0, 0, 0.5); */
            border: 1px solid black;
        }
        .page > div:nth-child(1),
        .page > div:nth-child(2) {
            height: calc(var(--boxHeight) - var(--pageMarginTop));
            border-top: none;
        }
        .page > div:nth-child(odd) {
            width: calc(var(--boxWidth) - var(--pageMarginLeft));
            border-left: none;
        }
        .page > div:nth-child(even) {
            width: calc(var(--boxWidth) - var(--pageMarginRight));
            border-right: none;
        }
        .page > div:nth-child(7),
        .page > div:nth-child(8) {
            height: calc(var(--boxHeight) - var(--pageMarginBottom));
            border-bottom: none;
        }

    </style>
</head>

<body>

    <div class="page">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

</body>

</html>
