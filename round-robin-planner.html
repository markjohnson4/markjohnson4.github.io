<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Robin Planner</title>
    <style>
        /* autogrow textarea */
        .grow-wrap {
  /* easy way to plop the elements on top of each other and have them both sized based on the tallest one's height */
  display: grid;
}
.grow-wrap::after {
  /* Note the weird space! Needed to preventy jumpy behavior */
  content: attr(data-replicated-value) " ";

  /* This is how textarea text behaves */
  white-space: pre-wrap;

  /* Hidden from view, clicks, and screen readers */
  visibility: hidden;
}
.grow-wrap > textarea {
  /* You could leave this, but after a user resizes, then it ruins the auto sizing */
  resize: none;
  width: 100%;

  /* Firefox shows scrollbar on growth, you can hide like this. */
  overflow: hidden;
}
.grow-wrap > textarea,
.grow-wrap::after {
  /* Identical styling required!! */
  border: 1px solid black;
  padding: 0.5rem;
  font: inherit;

  /* Place on top of each other */
  grid-area: 1 / 1 / 2 / 2;
}
/* / autogrow textarea */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
        }
        /* form */
        .textInput,
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }
        button {
            border: 1px solid black;
            padding: 1rem;
            text-align: center;
            width: 100%;
        }
        form {
            margin: 1rem auto;
            max-width: 40ch;
            padding: 1rem;
            border: 2px solid rgb(45, 152, 246);
            background-color: azure;
        }
        p,
        label {
            display: block;
            margin: 1rem 0;
        }
        label>span {
            display: block;
            padding-bottom: 0.5rem;
        }
        label>span:first-child {
            font-weight: bold;
        }

        textarea,
        input:not([type=checkbox]):not([type=radio]),
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <form action="">
        <label>
            <span>People and their contact info</span>
            <span>For each line write 1) one-word name, 2) email, and 3) phone number. Separate each of these with a space.</span>
            <div class="grow-wrap">
            <textarea  onInput="this.parentNode.dataset.replicatedValue = this.value" name="names-email-numbers"></textarea>
            </div>
        </label>
        <button type="submit">Submit</button>
    </form>
    <div id="html"></div>
    <script>
        // a formData object to be used in the app
        var formData = {};

        // getting data in the form piece by piece
        var urlObject = new URL(window.location.href);


        urlObject.searchParams.forEach((value, name) => {
            // save the info to the formData object
            formData[name] = value;

            // put data back into form
            var input = document.querySelector(`[name="${name}"]`);
            if (input) {
                var inputType = input.type;
                if (inputType == 'checkbox') {
                    if (value == 'on') {

                        input.checked = true;
                    }
                }
                else if (inputType == 'radio') {
                    document.querySelector('[name="' + name + '"][value="' + value + '"]').checked = true;
                }
                else {
                    document.querySelector('[name="' + name + '"]').value = value;
                }
            }
        });

        // after everything from the URL is loaded into the form, trigger the "input" event for all textareas so that they autogrow (using the existing autogrow css/html)
        document.querySelectorAll('textarea').forEach(elem => {
            elem.dispatchEvent(new Event('input', { bubbles: true }));
        });

        
    </script>
</body>
</html>
