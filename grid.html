<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: large;
        }
        @media print {
            .noPrint {
                display: none;
            }
        }
        /* form */
        .textInput,
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }

        button {
            border: 1px solid black;
            padding: 1rem;
            text-align: center;
            width: 100%;

        }
        .textWrap {
            margin: 1rem auto;
            max-width: 40ch;
            padding: 1rem;
            border: 2px solid rgb(45, 152, 246);
            background-color: azure;
        }
        p,
        label {
            display: block;
            margin: 1rem 0;
        }
        label>span {
            display: block;
            padding-bottom: 0.2rem;
        }

        /* app */
        :root {
            --line: 1px dotted rgba(0, 0, 0, 0.5);
            --cmPerInch: 2.54;
            --ptPerInch: 72pt;
            --ptPerCm: calc(var(--ptPerInch)/var(--cmPerInch))
        }
        * {
            box-sizing: border-box;
        }
        .page {
            box-sizing: border-box;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: calc(0.5*var(--ptPerCm)) calc(0.6*var(--ptPerCm)) calc(1.1*var(--ptPerCm)) calc(0.75*var(--ptPerCm));
        }
        .page > div {
            flex: 1;
            display: flex;
            border-bottom: var(--line);
        }
        .page > div:first-child {
            border-top: var(--line);
        }
        .page > div > div {
            flex: 1;
            border-right: var(--line);
        }
        .page > div > div:first-child {
            border-left: var(--line);
        }

    </style>
</head>

<body>

    <div class="noPrint textWrap">
        <div id="alert"></div>
        <h1>Quick Grid</h1>
        <form action="">

            <label>
                <span>Pages</span>
                <input type="number" name="pages" />
            </label>
            <label>
                <span>Rows</span>
                <input type="number" name="rows" />
            </label>
            <label>
                <span>Columns</span>
                <input type="number" name="columns" />
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
    <div id="html"></div>

    <script>
        var formData = {};

        // getting data in the form piece by piece
        var urlObject = new URL(window.location.href);


        urlObject.searchParams.forEach((value, name) => {
            // save the info to the formData object
            formData[name] = value;

            // put data back into form
            var input = document.querySelector(`[name="${name}"]`);
            if (input) {
                var inputType = input.type;
                if (inputType == 'checkbox') {
                    if (value == 'on') {

                        input.checked = true;
                    }
                }
                else if (inputType == 'radio') {
                    document.querySelector('[name="' + name + '"][value="' + value + '"]').checked = true;
                }
                else {
                    document.querySelector('[name="' + name + '"]').value = value;
                }
            }
        });

        // clean up text
        var pageNum = formData.pages;
        var rowNum = formData.rows;
        var colNum = formData.columns;

        var html = '';
        for (let index = 0; index < pageNum; index++) {
            html += '<div class="page">';
                for (let r = 0; r < rowNum; r++) {
                    html += '<div>';
                        for (let c = 0; c < colNum; c++) {
                            html += '<div></div>';
                        }
                    html += '</div>';
                }
            html += '</div>';
            
        }
        document.getElementById('html').innerHTML = html;
    </script>

</body>

</html>
