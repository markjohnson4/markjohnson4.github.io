            <input type="text" name="ft" />
        </label>
        <label class="block">
            <span class="block">MP3 URL</span>
            <input type="text" name="a" />
        </label>
        <label class="block">
            <span class="block">BPM</span>
            <input type="text" name="b" />
        </label>
        <label class="block">

            <input type="number" name="ptd" />

        <label class="block">
            <span class="block">Pulse Transition Timing Function</span>
            <input type="text" name="ptt" />
        </label>
        <label class="block">
            <span class="block">Color check frequency (milliseconds)</span>
            <input type="number" name="ccf" />
        </label>
        
        
        <label class="block">
            <span class="block">Color Picker</span>
            <input name="j" data-jscolor="">

        <br>
        <div>

        </div>
        <label for="displayVarsHelpers-yes">

                <input name="cvhh" data-jscolor="">

            </div>

        if (a.host !== location.host) {
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
        }
    }
</script>
</body>
</html>
