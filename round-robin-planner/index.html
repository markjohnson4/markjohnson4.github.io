<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Robin Planner</title>
    <style>
        /* autogrow textarea */
        .grow-wrap {
  /* easy way to plop the elements on top of each other and have them both sized based on the tallest one's height */
  display: grid;
}
.grow-wrap::after {
  /* Note the weird space! Needed to preventy jumpy behavior */
  content: attr(data-replicated-value) " ";

  /* This is how textarea text behaves */
  white-space: pre-wrap;

  /* Hidden from view, clicks, and screen readers */
  visibility: hidden;
}
.grow-wrap > textarea {
  /* You could leave this, but after a user resizes, then it ruins the auto sizing */
  resize: none;
  width: 100%;

  /* Firefox shows scrollbar on growth, you can hide like this. */
  overflow: hidden;
}
.grow-wrap > textarea,
.grow-wrap::after {
  /* Identical styling required!! */
  border: 1px solid black;
  padding: 0.5rem;
  font: inherit;

  /* Place on top of each other */
  grid-area: 1 / 1 / 2 / 2;
}
/* / autogrow textarea */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* form */
        .textInput,
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }
        button {
            border: 1px solid black;
            padding: 1rem;
            text-align: center;
            width: 100%;
        }
        form {
            margin: 1rem auto;
            max-width: 40ch;
            padding: 1rem;
            border: 2px solid rgb(45, 152, 246);
            background-color: azure;
        }
        form> *:first-child {
            margin-top: 0 !important;
        }
        p,
        label {
            display: block;
            margin: 1rem 0;
        }
        label>span {
            display: block;
            padding-bottom: 0.5rem;
        }
        label>span:first-child {
            font-weight: bold;
        }

        textarea,
        input:not([type=checkbox]):not([type=radio]),
        select {
            padding: 0.5rem;
            display: block;
            border: 1px solid black;
        }
        .bigWrap {
            display: flex;
        }
        #htmlWrap {
            flex: 1;
        }
        section {
            margin: 1rem 0;
            padding: 1rem;
            border: 1rem solid currentColor;
        }
        .allPeopleWrap section {
            min-height: 100vh;
        }
        .allPeopleWrap section:nth-child(3n) {
            color: rgb(0, 103, 117);
        }
        .allPeopleWrap section:nth-child(3n + 1) {
            color: rgb(98, 3, 98);
        }
        .allPeopleWrap section:nth-child(3n + 2) {
            color: rgb(0, 91, 78);
        }
        h1, h2, h3, h4, h5, h6 {
            margin-top: 1em;
        }
        section > *:first-child {
            margin-top: 0;
        }
        nav {
            border: 1px solid black;
            padding: 1rem;
            font-size: 1.5rem;
        }
        nav ul {
            list-style-position: inside;
        }
        nav li + li {
            margin-top: 1rem;
        }
        a#links {
            background-color: white;
            color: blue;
            font-size: 1.5rem;
            border: 3px solid currentColor;
            padding: 0.5rem 1rem;
            display: inline-block;
            position: fixed;
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center">Round Robin Planner</h1>
    <form id="form" action="">
        <!-- <label>
            <span>Start Date/Time</span>
            <input type="datetime" name="start">
        </label>
        <label>
            <span>Total Minutes of Event</span>
            <input type="number" name="minutes">
        </label> -->
        <label>
            <span>People (each on their own line)</span>
            <!-- <span>People and their contact info</span>
            <span>For each line write 1) one-word name, 2) email, and 3) phone number. Separate each of these with a space.</span> -->
            <div class="grow-wrap">
            <textarea name="peopleData" onInput="this.parentNode.dataset.replicatedValue = this.value"></textarea>
            </div>
        </label>
        <label>
            <span>Locations (each on their own line)</span>
            <span>(Default is "location 1", "location 2", etc.)</span>
            <span id="locationsPrompt"></span>
            <div class="grow-wrap">
            <textarea name="locations" onInput="this.parentNode.dataset.replicatedValue = this.value"></textarea>
            </div>
        </label>
        <label>
            <span>Solitary Location</span>
            <span>(only needed if you have an odd number of people)</span>
            <input type="text" name="solitaryLocation">
        </label>
        <button type="submit">Submit</button>
    </form>
    <div id="htmlWrap"></div>
    <script src="main.js"></script>
</body>
</html>
